version: '3.9'

services:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: genesis_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: genesis_user
      POSTGRES_PASSWORD: genesis_pass
      POSTGRES_DB: genesis_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genesis_user -d genesis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genesis_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://genesis_user:genesis_pass@postgres:5432/genesis_db
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_GENESIS_SECRET_2026}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      UPLOAD_DIR: /backend/uploads
      CHROMA_DB_DIR: /backend/chroma_db
    volumes:
      - backend_uploads:/backend/uploads
      - backend_chroma:/backend/chroma_db
    ports:
      - "8000:8000"

  # ─── React Frontend ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genesis_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
  backend_uploads:
  backend_chroma:
